  <style>
    :root{color-scheme:dark;--bg:#070b0a;--panel:#0d1211;--panel2:#121918;--panel3:#17201e;--line:#26332f;--text:#edf5f2;--muted:#9aaba5;--faint:#70817b;--green:#3be0a5;--green2:#1bc590;--cyan:#4bd6ed;--amber:#ffb64d;--red:#ff7884;--blue:#6f86ff;--shadow:0 20px 60px rgba(0,0,0,.34);--r:15px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font:14px/1.45 Manrope,sans-serif;font-variant-numeric:tabular-nums}button{font:inherit}button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.shell{width:min(1460px,100%);margin:auto;padding:28px clamp(15px,3vw,42px) 40px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:clamp(28px,4vw,43px);line-height:1.05;letter-spacing:-.045em}.hero p{margin:0;color:var(--muted);font-size:13px}.asof{text-align:right;color:var(--muted);font:10px/1.7 "IBM Plex Mono",monospace;white-space:nowrap}.asof b{color:var(--green)}
    .control-deck{position:sticky;top:0;z-index:10;margin:0 0 16px;background:rgba(7,11,10,.96);border-bottom:1px solid var(--line);padding:10px 0 0;backdrop-filter:blur(12px)}.scope-row{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:11px}.scope-label{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.pills{display:flex;gap:6px;flex-wrap:wrap}.pill,.quarter-select,.reset,.filter-chip{border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--muted);padding:7px 10px;cursor:pointer;font:600 10px "IBM Plex Mono",monospace}.pill:hover,.pill.active,.quarter-select.active{background:var(--green);border-color:var(--green);color:#03120d}.quarter-select{min-width:112px;color-scheme:dark}.quarter-select option{background:var(--panel2);color:var(--text)}.quarter-select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.reset{margin-left:auto;color:var(--text);background:transparent}.reset:disabled{opacity:.35;cursor:default}.scope-copy{color:var(--muted);font:500 10px "IBM Plex Mono",monospace}.filter-chip{color:var(--cyan);border-color:rgba(75,214,237,.4);cursor:default}.tabs{display:grid;grid-template-columns:repeat(7,auto);justify-content:start;gap:4px;margin-top:7px}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:9px 12px 10px;cursor:pointer;font-weight:750;font-size:11px}.tab:hover,.tab.active{color:var(--text);border-bottom-color:var(--green)}
    .section-intro{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:6px 0 13px}.section-intro h2{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}.section-intro p{margin:0;color:var(--muted);font-size:11px}.scope-note{color:var(--muted);font:600 9px "IBM Plex Mono",monospace;text-align:right}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.stack-layout{display:grid;gap:11px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}.panel{padding:18px}.panel-head{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:16px}.panel-head h3{margin:0 0 4px;font-size:14px}.panel-head p{margin:0;color:var(--muted);font-size:10px}.mono{font-family:"IBM Plex Mono",monospace}.clickable{position:relative;width:100%;border:1px solid var(--line);color:inherit;text-align:left;cursor:pointer;background:var(--panel);transition:background .15s,border-color .15s}.clickable:hover,.clickable:focus-visible{background:var(--panel2);border-color:#3c4d48}.clickable:after{content:"View";position:absolute;right:14px;top:13px;color:var(--faint);font:600 8px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.06em}.kpi{min-height:142px;padding:17px}.kpi .label{display:block;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.075em;padding-right:42px}.kpi .value{display:block;margin:13px 0 6px;font-size:clamp(23px,2.6vw,36px);line-height:1.06;font-weight:800;letter-spacing:-.045em}.kpi .sub{display:block;color:var(--muted);font-size:10px}.signal{display:inline-flex;margin-top:12px;padding:4px 7px;border-radius:99px;background:#102d24;color:var(--green);font:600 9px "IBM Plex Mono",monospace}.signal.warn{background:rgba(255,182,77,.1);color:var(--amber)}
    .summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden}.summary-item{border:0;background:var(--panel);color:inherit;text-align:left;padding:14px;cursor:pointer}.summary-item:hover{background:var(--panel2)}.summary-item span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:800}.summary-item b{display:block;margin-top:5px;font:600 14px "IBM Plex Mono",monospace}.chart-card{padding:18px}.chart{height:245px;display:flex;align-items:stretch;gap:10px}.yaxis{width:44px;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0 28px;color:var(--faint);text-align:right;font:9px "IBM Plex Mono",monospace}.plot{position:relative;flex:1;display:grid;gap:10px;border-bottom:1px solid var(--line)}.plot:before{content:"";position:absolute;inset:0 0 27px;background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 25%);opacity:.65;pointer-events:none}.month{border:0;background:transparent;color:inherit;padding:0;z-index:1;display:flex;flex-direction:column;justify-content:end;cursor:pointer}.month:hover .month-bars,.month:focus-visible .month-bars{background:rgba(255,255,255,.035)}.month-bars{height:202px;display:flex;align-items:end;justify-content:center;gap:clamp(4px,1vw,10px);padding:6px;border-radius:8px 8px 0 0}.bar{display:block;width:min(25px,26%);min-height:2px;border-radius:4px 4px 1px 1px;background:var(--c)}.month-label{height:27px;padding-top:8px;color:var(--muted);font:600 9px "IBM Plex Mono",monospace}.legend{display:flex;gap:13px;flex-wrap:wrap;color:var(--muted);font-size:9px;font-weight:700}.legend span{display:flex;align-items:center;gap:5px}.swatch{width:7px;height:7px;border-radius:2px;background:var(--c)}
    .category-list,.row-list{display:grid}.category,.data-row{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;border:0;border-top:1px solid var(--line);background:transparent;color:inherit;padding:12px 4px;text-align:left;cursor:pointer}.category:first-child,.data-row:first-child{border-top:0}.category:hover,.data-row:hover{background:var(--panel2)}.category i{width:8px;height:8px;border-radius:2px;background:var(--c)}.category span,.data-row span{color:var(--muted);font-size:11px}.category b,.data-row b{font:600 11px "IBM Plex Mono",monospace}.category.active{color:var(--cyan)}.data-row{grid-template-columns:1fr auto}.data-row small{display:block;margin-top:2px;color:var(--muted);font-size:9px}.bar-track{height:9px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:13px 0 4px}.bar-track i{display:block;height:100%;background:var(--green)}.big-number{font-size:clamp(31px,4vw,50px);font-weight:800;letter-spacing:-.055em;color:var(--green)}.muted{color:var(--muted)}.small{font-size:10px}.timeline{display:grid;grid-template-columns:repeat(var(--count),minmax(0,1fr));gap:7px;padding:10px 2px 2px}.timeline button{position:relative;border:0;border-top:2px solid var(--line);background:transparent;color:inherit;padding:14px 2px 5px;text-align:left;cursor:pointer}.timeline button:before{content:"";position:absolute;top:-5px;left:2px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--panel)}.timeline button:hover{border-color:var(--green)}.timeline span{display:block;color:var(--muted);font:500 8px "IBM Plex Mono",monospace}.timeline b{display:block;margin-top:4px;font:600 10px "IBM Plex Mono",monospace}.fun-chart{position:relative;height:210px;padding:10px 8px 0}.fun-chart svg{width:100%;height:190px;overflow:visible}.gridline{stroke:var(--line);stroke-width:1}.trend{fill:none;stroke:var(--green);stroke-width:3;vector-effect:non-scaling-stroke}.area{fill:#102d24;opacity:.7}.point{fill:var(--panel);stroke:var(--green);stroke-width:3;cursor:pointer}.payline{stroke:var(--cyan);stroke-width:2;stroke-dasharray:4 4}.axistext{fill:var(--muted);font:9px "IBM Plex Mono",monospace}.tag{display:inline-flex;padding:4px 7px;border-radius:99px;background:var(--panel2);color:var(--muted);font:600 8px "IBM Plex Mono",monospace}.note{padding:12px;background:var(--panel2);border-radius:9px;color:var(--muted);font-size:10px;line-height:1.55}.note strong{color:var(--text)}

bottom:0}.position-row:hover,.position-row:focus-visible{background:var(--panel2)}.position-cell{min-width:0;padding:11px 7px;font:500 10px "IBM Plex Mono",monospace}.position-cell.symbol{text-align:left;color:var(--text);font-weight:700}.position-cell.description{text-align:left;color:var(--muted);font-family:Manrope,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gain-positive{color:var(--green)}.gain-negative{color:var(--red)}.position-cell.gain small{display:block;color:inherit;font-size:8px}.holding-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin:8px 0 14px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}.holding-detail{padding:14px;background:var(--panel2)}.holding-detail span{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;font-weight:800}.holding-detail b{display:block;margin-top:5px;font:600 12px "IBM Plex Mono",monospace}

<body>
  <main class="shell" id="app"></main>
  <aside class="drawer-shell" id="drawerShell" aria-hidden="true"><button class="backdrop" id="drawerBackdrop" aria-label="Close details"></button><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><header class="drawer-head"><div class="breadcrumb" id="drawerCrumb">Dashboard / Details</div><div class="drawer-title-row"><div><h2 id="drawerTitle"></h2><p id="drawerSubtitle"></p></div><button class="close" id="drawerClose" type="button">Close</button></div></header><div class="drawer-body" id="drawerBody"></div></section></aside>
  <div class="tip" id="tip" role="status"></div>
  <script>
  (function(){
    'use strict';
    var dataBlock=document.getElementById('dashboard-data');
    var DATA=JSON.parse(atob(dataBlock.textContent.replace(/\s/g,'')));
    var app=document.getElementById('app');
    var state={tab:'overview',month:'all',quarter:'all',category:null,lastTrigger:null,holdingsSort:{key:'value',dir:'desc'}};
    var C={emerald:'var(--green)',cyan:'var(--cyan)',amber:'var(--amber)',blue:'var(--blue)',gray:'#7d8c87',red:'var(--red)'};
    var money=function(v,d){return new Intl.NumberFormat('en-US',{style:'currency',currency:DATA.meta.currency,minimumFractionDigits:d===undefined?2:d,maximumFractionDigits:d===undefined?2:d}).format(v)};
    var whole=function(v){return money(v,0)};var number=function(v){return new Intl.NumberFormat('en-US').format(v)};
    var sum=function(a,k){return a.reduce(function(s,x){return s+(k?x[k]:x)},0)};
    DATA.accounts.totalCash=sum(DATA.accounts.buckets,'amount');
    DATA.overview.availableCash=DATA.accounts.totalCash;
    DATA.overview.netWorth=DATA.accounts.brokerage+DATA.accounts.totalCash-sum(DATA.accounts.cards,'amount');
    DATA.rewards.reportedAsOfLabel='Oct 1, 2026';
    var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')};
    var quarterKey=function(monthKey){var p=monthKey.split('-');return p[0]+'-Q'+Math.ceil(+p[1]/3)};
    var quarterLabel=function(key){var p=key.split('-Q');return 'Q'+p[1]+' '+p[0]};
    var quarters=function(){var seen={};DATA.monthly.forEach(function(m){seen[quarterKey(m.key)]=true});if(DATA.spending&&DATA.spending.chase&&DATA.spending.chase.monthly)DATA.spending.chase.monthly.forEach(function(m){seen[quarterKey(m.key)]=true});return Object.keys(seen).sort()};
    var periodContainsMonth=function(key){return state.month==='all'&&state.quarter==='all'||state.month!=='all'&&key===state.month||state.quarter!=='all'&&quarterKey(key)===state.quarter};
    var months=function(){return DATA.monthly.filter(function(m){return periodContainsMonth(m.key)})};
    var monthAbbr=function(key){return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+key.slice(5)-1]};
    var windowKeys=function(list){return list.map(function(x){return x.key}).filter(function(key){return /^\d{4}-\d{2}$/.test(key)}).sort()};
    var winLabel=function(list){var keys=windowKeys(list),first=keys[0],last=keys[keys.length-1];if(!first)return 'No period';return first.slice(0,4)===last.slice(0,4)?monthAbbr(first)+' to '+monthAbbr(last)+' '+last.slice(0,4):monthAbbr(first)+' '+first.slice(0,4)+' to '+monthAbbr(last)+' '+last.slice(0,4)};
    var winShort=function(list){var keys=windowKeys(list),first=keys[0],last=keys[keys.length-1];return first?monthAbbr(first)+' to '+monthAbbr(last):'No period'};
    var incomeSourcesWindow=function(){var keys=windowKeys(DATA.monthly),latest=keys[keys.length-1],latestPaycheckIncome=sum(DATA.income.paychecks.filter(function(p){return p.date.slice(0,7)===latest}),'amount');return latestPaycheckIncome===0?winLabel(DATA.monthly.filter(function(m){return m.key<latest})):winLabel(DATA.monthly)};
    var monthName=function(){var m=months();if(state.quarter!=='all')return quarterLabel(state.quarter);return state.month==='all'?winLabel(DATA.monthly):(m[0]?m[0].label:'No period')};
    var tipAttr=function(s){return ' data-tip="'+esc(s)+'" tabindex="0"'};
    var delta=function(list,i,key){if(i===0)return 'No prior period in view';var d=list[i][key]-list[i-1][key];return (d>=0?'+':'')+money(d)+' vs prior period'};
    var tabs=[['overview','Overview'],['flow','Cash flow'],['income','Income'],['projections','Projections'],['spending','Spending'],['accounts','Accounts'],['holdings','Holdings']];
    function header(){var active=state.month!=='all'||state.quarter!=='all'||state.category;return '<header class="hero"><div><h1>'+esc(DATA.meta.headline)+'</h1><p>'+esc(DATA.meta.summary)+'</p></div><div class="asof"><b>● DATA AS OF</b><br>'+esc(DATA.meta.asOfLabel)+'</div></header><div class="control-deck"><div class="scope-row"><span class="scope-label">Period</span><div class="pills"><button class="pill '+(state.month==='all'&&state.quarter==='all'?'active':'')+'" data-month="all">All</button>'+DATA.monthly.map(function(m){return '<button class="pill '+(state.month===m.key&&state.quarter==='all'?'active':'')+'" data-month="'+m.key+'">'+m.short[0]+m.short.slice(1).toLowerCase()+'</button>'}).join('')+'</div><select class="quarter-select '+(state.quarter!=='all'?'active':'')+'" data-quarter aria-label="Filter by quarter"><option value="all">Quarter</option>'+quarters().map(function(q){return '<option value="'+q+'" '+(state.quarter===q?'selected':'')+'>'+quarterLabel(q)+'</option>'}).join('')+'</select><span class="scope-copy">Applied: '+monthName()+'</span>'+(state.category?'<span class="filter-chip">'+categoryName(state.category)+'</span>':'')+'<button class="reset" data-reset '+(active?'':'disabled')+'>Reset</button></div><nav class="tabs" aria-label="Dashboard sections">'+tabs.map(function(t){return '<button class="tab '+(state.tab===t[0]?'active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</nav></div>'}
    function intro(title,copy){var filterable=state.tab==='flow'||state.tab==='income'||state.tab==='spending',note=state.tab==='holdings'?'HOLDINGS SNAPSHOT · OCT 3, 2026':filterable?'FILTER: '+monthName().toUpperCase()+(state.tab==='spending'&&state.category?' · '+categoryName(state.category).toUpperCase():''):'SNAPSHOT · PERIOD SELECTION SAVED';return '<div class="section-intro"><div><h2>'+title+'</h2><p>'+copy+'</p></div><div class="scope-note">'+note+'</div></div>'}
    function kpi(label,value,sub,key,tone){return '<button class="card kpi clickable" data-drill="'+key+'"'+tipAttr(label+': '+value+'. '+sub)+'><span class="label">'+label+'</span><span class="value">'+value+'</span><span class="sub">'+sub+'</span><span class="signal '+(tone==='warn'?'warn':'')+'">Open records</span></button>'}
    function renderOverview(){var o=DATA.overview,a=DATA.accounts,r=DATA.rewards;return intro('Overview','Snapshot balances and the strongest signals')+'<section class="grid4">'+kpi('Net worth',money(o.netWorth),money(o.invested)+' invested','networth')+kpi('Available cash',money(o.availableCash),'Across '+o.cashBucketCount+' cash buckets','cash')+kpi('Monthly investing',money(o.monthlyInvesting),winShort(DATA.monthly)+' average','investing','warn')+kpi('Monthly net','+'+money(o.monthlyNet),'After spend and investing','net')+'</section><section class="grid2" style="margin-top:11px"><article class="card panel"><div class="panel-head"><div><h3>Rewards balances</h3><p>User reported '+DATA.rewards.reportedAsOfLabel+'</p></div><span class="tag">SNAPSHOT</span></div><div class="summary-strip"><button class="summary-item" data-drill="chaseRewards"'+tipAttr('Chase Ultimate Rewards: '+number(r.chase)+' points, plus '+number(r.chasePending)+' pending')+'><span>Chase UR</span><b>'+number(r.chase)+'</b></button><button class="summary-item" data-drill="capitalRewards"'+tipAttr('Capital One Venture miles: '+number(r.capitalOne))+'><span>Capital One</span><b>'+number(r.capitalOne)+'</b></button><button class="summary-item" data-drill="flagged"'+tipAttr('Flagged items: '+DATA.spending.flagged.length)+'><span>Flagged</span><b>'+DATA.spending.flagged.length+'</b></button><button class="summary-item" data-drill="utilization"'+tipAttr('Credit utilization: '+a.utilization+'%, limit '+money(a.combinedLimit))+'><span>Card utilization</span><b>'+a.utilization+'%</b></button></div></article><article class="card panel"><div class="panel-head"><div><h3>Attention</h3><p>Only current, actionable signals</p></div></div><button class="data-row" data-drill="dining"'+tipAttr('Dining: '+money(DATA.spending.lifestyle.categories[0].amount)+' across '+winShort(DATA.monthly))+'><span><strong>Dining concentration</strong><small>'+money(DATA.spending.lifestyle.categories[0].amount)+' in the available window</small></span><b>View</b></button><button class="data-row" data-drill="masked"'+tipAttr('Masked charge: '+money(DATA.spending.flagged[1].amount)+', review needed')+'><span><strong>Masked charge</strong><small>Unidentified bank descriptor</small></span><b style="color:var(--red)">'+money(DATA.spending.flagged[1].amount)+'</b></button></article></section>'}
    function summary(monthList){var inc=sum(monthList,'income'),sp=sum(monthList,'spend'),inv=sum(monthList,'investing'),net=inc-sp-inv;return '<div class="summary-strip"><button class="summary-item" data-drill="income"'+tipAttr('Income: '+money(inc)+' for '+monthName())+'><span>Income</span><b>'+money(inc)+'</b></button><button class="summary-item" data-drill="spend"'+tipAttr('Spend: '+money(sp)+' for '+monthName())+'><span>Spend</span><b>'+money(sp)+'</b></button><button class="summary-item" data-drill="investing"'+tipAttr('Investing: '+money(inv)+' for '+monthName())+'><span>Investing</span><b>'+money(inv)+'</b></button><button class="summary-item" data-drill="net"'+tipAttr('Net: '+money(net)+' for '+monthName())+'><span>Net</span><b style="color:var(--green)">'+money(net)+'</b></button></div>'}
    function renderFlow(){var ms=months();if(!ms.length)return intro('Cash flow','Tap a month for the underlying records')+'<section class="card panel"><div class="empty">No cash flow data before Jul 2026.</div></section>';var max=Math.max.apply(null,ms.reduce(function(a,m){return a.concat([m.income,m.spend,m.investing])},[1]));return intro('Cash flow','Tap a month for the underlying records')+'<section class="stack-layout">'+summary(ms)+'<article class="card chart-card"><div class="panel-head"><div><h3>Monthly movement</h3><p>Income, external spend and investing</p></div><div class="legend"><span><i class="swatch" style="--c:var(--green)"></i>Income</span><span><i class="swatch" style="--c:var(--cyan)"></i>Spend</span><span><i class="swatch" style="--c:var(--amber)"></i>Investing</span></div></div><div class="chart"><div class="yaxis"><span>'+whole(max)+'</span><span>'+whole(max*.75)+'</span><span>'+whole(max*.5)+'</span><span>'+whole(max*.25)+'</span><span>$0</span></div><div class="plot" style="grid-template-columns:repeat('+ms.length+',1fr)">'+ms.map(function(m,i){return '<button class="month" data-month-drill="'+m.key+'"'+tipAttr(m.label+': income '+money(m.income)+' ('+delta(DATA.monthly,DATA.monthly.indexOf(m),'income')+'), spend '+money(m.spend)+', investing '+money(m.investing))+'><span class="month-bars"><i class="bar" style="height:'+(m.income/max*100)+'%;--c:var(--green)"></i><i class="bar" style="height:'+(m.spend/max*100)+'%;--c:var(--cyan)"></i><i class="bar" style="height:'+(m.investing/max*100)+'%;--c:var(--amber)"></i></span><span class="month-label">'+m.short+'</span></button>'}).join('')+'</div></div></article></section>'}

      else if(kind==='projInvest'||kind==='investing'){title=kind==='projInvest'?'Invest bucket scenario':'Investing records';(kind==='projInvest'?DATA.projections.investTimeline:months()).forEach(function(x){add(x.label||x.key,kind==='projInvest'?'Projected closing balance':'Monthly investing',x.value===undefined?x.investing:x.value,kind==='projInvest'?'Invest bucket scenario':'Fidelity')})}
      else if(kind==='projTravel'){title='Travel projection';DATA.projections.travelTimeline.forEach(function(x){add(x.label,'Projected travel balance',x.value,'Travel bucket scenario')})}
      else if(kind==='projCash'){title='Total cash projection';DATA.projections.cashTimeline.forEach(function(x){add(x.label,'Projected total cash',x.value,'Cash scenario, brokerage excluded')})}
      else if(kind==='holdingsAll'||kind==='holdingsGainers'||kind==='holdingsDay'||kind==='holdingsCost'){title=kind==='holdingsGainers'?'Portfolio lifetime gain':kind==='holdingsDay'?'Portfolio day change':kind==='holdingsCost'?'Portfolio cost basis':'Portfolio value';sub=DATA.holdings.refreshNote;add(DATA.holdings.asOfLabel,title,kind==='holdingsGainers'?DATA.holdings.lifetimeGain:kind==='holdingsDay'?DATA.holdings.dayChange:kind==='holdingsCost'?DATA.holdings.costBasis:DATA.holdings.totalValue,'Fidelity · '+DATA.holdings.accountName+' · …'+DATA.holdings.accountSuffix)}
      else if(kind==='assumptions'){title='Projection assumptions';sub='Scenario inputs, not transactions';add('Biweekly','Paycheck',DATA.income.standardDeposit,'Income assumption');add('Alternating week','Fidelity Week A',DATA.accounts.fidelityWeekA,'Transfer assumption');add('Alternating week','Fidelity Week B',DATA.accounts.fidelityWeekB,'Transfer assumption');add('Trip','Taiwan projected spend',DATA.projections.taiwanSpend,'Travel assumption')}
      else if(kind==='dining'){title='Dining transactions';state.category='food';DATA.spending.transactions.filter(function(x){return x.category==='food'}).forEach(function(x){add(x.date,x.merchant,x.amount,'Account unavailable')})}
      else if(kind==='funAccrued'||kind==='funSpent'||kind==='funRefunds'||kind==='funBalance'){title='Fun budget detail';DATA.funBudget.timeline.forEach(function(x){add(x.date,x.paycheck?'Budget accrued':'Fun spend',x.paycheck||-x.spend,'Fun CC running balance '+money(x.balance))})}
      else if(kind==='spend'||kind==='net'){title=kind==='spend'?'Spending records':'Net cash flow';months().forEach(function(x){add(x.label,kind==='spend'?'Monthly spend':'Income less spend and investing',kind==='spend'?x.spend:x.income-x.spend-x.investing,'Verified monthly aggregate')})}
      return{title:title,sub:sub,crumb:crumb,rows:rows}}
    function categoryRecords(id){var c=DATA.spending.categories.filter(function(x){return x.id===id})[0],rows=DATA.spending.transactions.filter(function(x){return x.category===id}).map(function(x){return{date:x.date,name:x.merchant,amount:x.amount,account:'Account unavailable'}});return{title:c.name+' transactions',sub:DATA.spending.transactionsCoverage+' · available source detail',crumb:'Spending / '+c.name,rows:rows}}
    function monthRecords(key){var m=DATA.monthly.filter(function(x){return x.key===key})[0],chase=DATA.spending.chase.monthly.filter(function(x){return x.key===key})[0],names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],label=m?m.label:names[+key.slice(5)-1]+' '+key.slice(0,4),rows=[];DATA.income.paychecks.filter(function(x){return x.date.slice(0,7)===key}).forEach(function(x){rows.push({date:x.label,name:x.source,amount:x.amount,account:x.type})});if(m){rows.push({date:m.label,name:'External spend total',amount:m.spend,account:'Verified monthly aggregate'});rows.push({date:m.label,name:'Investing total',amount:m.investing,account:'Fidelity aggregate'})}else if(chase)rows.push({date:label,name:'Chase spending total',amount:chase.value,account:'Chase monthly aggregate'});return{title:label+' records',sub:'Filter applied across all tabs',crumb:'Dashboard / '+label,rows:rows}}
    function funRecords(i){var f=DATA.funBudget,t=f.timeline[i],ac=sum(f.timeline.slice(0,i+1),'paycheck'),spent=sum(f.timeline.slice(0,i+1),'spend');return{title:t.label+' fun balance',sub:'Budget position at this marker',crumb:'Spending / Fun budget',rows:[{date:t.date,name:'Budget accrued',amount:ac,account:'Fun CC budget'},{date:t.date,name:'Spent',amount:-spent,account:'Fun CC spending'},{date:t.date,name:'Running balance',amount:t.balance,account:'Fun CC balance'}]}}
    function holdingBySymbol(symbol){return DATA.holdings.positions.filter(function(p){return p[0]===symbol})[0]}
    function holdingGroupName(id){var a=DATA.holdings.allocation.filter(function(x){return x.id===id})[0];return a?a.name:id}
    function openHolding(symbol,trigger){var p=holdingBySymbol(symbol);if(!p)return;state.lastTrigger=trigger||document.activeElement;document.getElementById('drawerTitle').textContent=p[0]+' · '+p[1];document.getElementById('drawerSubtitle').textContent=DATA.holdings.refreshNote;document.getElementById('drawerCrumb').textContent='Holdings / '+p[0];document.getElementById('drawerBody').innerHTML='<div class="holding-detail-grid"><div class="holding-detail"><span>Current value</span><b>'+money(p[4])+'</b></div><div class="holding-detail"><span>Account share</span><b>'+p[7].toFixed(2)+'%</b></div><div class="holding-detail"><span>Quantity</span><b>'+formatQuantity(p[2])+'</b></div><div class="holding-detail"><span>Last price</span><b>'+formatLast(p[3])+'</b></div><div class="holding-detail"><span>Lifetime gain</span><b class="'+(p[5]===null?'muted':p[5]>=0?'gain-positive':'gain-negative')+'">'+(p[5]===null?'Unavailable':signedMoney(p[5]))+'</b></div><div class="holding-detail"><span>Lifetime return</span><b class="'+(p[6]===null?'muted':p[6]>=0?'gain-positive':'gain-negative')+'">'+(p[6]===null?'Unavailable':signedPct(p[6]))+'</b></div></div><div class="note"><strong>Allocation group:</strong> '+esc(holdingGroupName(p[8]))+'<br><strong>Source:</strong> Manual Fidelity CSV upload. This snapshot does not auto-refresh.</div>';var shell=document.getElementById('drawerShell');shell.classList.add('open');shell.setAttribute('aria-hidden','false');document.getElementById('drawerClose').focus()}
    function openHoldingGroup(id,trigger){var a=DATA.holdings.allocation.filter(function(x){return x.id===id})[0],rows=DATA.holdings.positions.filter(function(p){return p[8]===id}).sort(function(x,y){return y[4]-x[4]}).map(function(p){return{date:p[0],name:p[1],amount:p[4],account:p[7].toFixed(2)+'% of account'}});openDrawer({title:a.name,sub:money(a.amount)+' · '+a.pct.toFixed(1)+'% of portfolio',crumb:'Holdings / Allocation',rows:rows},trigger)}
    function openDrawer(data,trigger){state.lastTrigger=trigger||document.activeElement;document.getElementById('drawerTitle').textContent=data.title;document.getElementById('drawerSubtitle').textContent=data.sub;document.getElementById('drawerCrumb').textContent=data.crumb;document.getElementById('drawerBody').innerHTML=data.rows.length?data.rows.map(function(x){return '<div class="record"><div class="record-date">'+esc(x.date)+'</div><div><div class="record-name">'+esc(x.name)+'</div><div class="record-account">'+esc(x.account)+'</div></div><div class="record-amount"'+(x.amount<0?' style="color:var(--red)"':'')+'>'+money(x.amount)+'</div></div>'}).join(''):'<div class="empty">No transaction level rows for this selection are present in the source snapshot.</div>';var shell=document.getElementById('drawerShell');shell.classList.add('open');shell.setAttribute('aria-hidden','false');document.getElementById('drawerClose').focus()}
    function closeDrawer(){var shell=document.getElementById('drawerShell');shell.classList.remove('open');shell.setAttribute('aria-hidden','true');if(state.lastTrigger&&state.lastTrigger.focus)state.lastTrigger.focus()}
    function render(){var body=state.tab==='overview'?renderOverview():state.tab==='flow'?renderFlow():state.tab==='income'?renderIncome():state.tab==='projections'?renderProjections():state.tab==='spending'?renderSpending():state.tab==='accounts'?renderAccounts():renderHoldings();app.innerHTML=header()+body+'<footer class="footer"><strong>Coverage</strong><span>Chase spending covers '+winLabel(DATA.spending.chase.monthly)+'. Income and cash flow cover '+winLabel(DATA.monthly)+'. Figures are bank data as of '+DATA.meta.asOfLabel+' and may lag live balances.</span></footer>'}
    function showTip(el,e){var tip=document.getElementById('tip');tip.textContent=el.getAttribute('data-tip');tip.classList.add('show');var r=el.getBoundingClientRect(),x=e&&e.clientX?e.clientX:r.left+r.width/2,y=e&&e.clientY?e.clientY:r.top;tip.style.left=Math.min(innerWidth-tip.offsetWidth-10,Math.max(10,x+12))+'px';tip.style.top=Math.min(innerHeight-tip.offsetHeight-10,Math.max(10,y-tip.offsetHeight-12))+'px'}
    function hideTip(){document.getElementById('tip').classList.remove('show')}
    app.addEventListener('click',function(e){var el;if((el=e.target.closest('[data-tab]'))){state.tab=el.dataset.tab;render();return}if((el=e.target.closest('[data-holdings-sort]'))){var key=el.dataset.holdingsSort;state.holdingsSort.dir=state.holdingsSort.key===key&&state.holdingsSort.dir==='desc'?'asc':'desc';state.holdingsSort.key=key;render();return}if((el=e.target.closest('[data-holding-group]'))){openHoldingGroup(el.dataset.holdingGroup,el);return}if((el=e.target.closest('[data-holding]'))){openHolding(el.dataset.holding,el);return}if((el=e.target.closest('[data-reset]'))){state.month='all';state.quarter='all';state.category=null;render();return}if((el=e.target.closest('[data-month]'))){state.month=el.dataset.month;state.quarter='all';render();return}if((el=e.target.closest('[data-month-drill]'))){state.month=el.dataset.monthDrill;state.quarter='all';render();openDrawer(monthRecords(state.month),el);return}if((el=e.target.closest('[data-category]'))){state.category=el.dataset.category;render();openDrawer(categoryRecords(state.category),el);return}if((el=e.target.closest('[data-fun]'))){openDrawer(funRecords(+el.dataset.fun),el);return}if((el=e.target.closest('[data-drill]'))){openDrawer(recordsFor(el.dataset.drill),el)}});
    app.addEventListener('change',function(e){var el=e.target.closest('[data-quarter]');if(!el)return;state.quarter=el.value;state.month='all';render()});
    document.addEventListener('pointerover',function(e){var el=e.target.closest('[data-tip]');if(el)showTip(el,e)});document.addEventListener('pointerout',function(e){if(e.target.closest('[data-tip]'))hideTip()});document.addEventListener('focusin',function(e){var el=e.target.closest('[data-tip]');if(el)showTip(el)});document.addEventListener('focusout',function(e){if(e.target.closest('[data-tip]'))hideTip()});
    document.getElementById('drawerClose').addEventListener('click',closeDrawer);document.getElementById('drawerBackdrop').addEventListener('click',closeDrawer);document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer()});render();
  }());
  </script>
